<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E0F33;--ink:#FBE8F6;--panel:#33204D;--line:#5A3A7E;--th:#4A3568}}
:root[data-theme="dark"]{--bg:#1E0F33;--ink:#FBE8F6;--panel:#33204D;--line:#5A3A7E;--th:#4A3568}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka',ui-rounded,'Segoe UI',system-ui,sans-serif}
main{max-width:620px;margin:0 auto;padding:10px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{margin:0;font-size:1.45rem;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:2px solid var(--acc);background:var(--panel);border-radius:999px;padding:6px 12px;font-weight:500;font-size:.85rem}
.btn.main{background:var(--acc);color:#fff}
#stage{position:relative;height:min(52vh,500px);border-radius:26px;overflow:hidden;box-shadow:0 6px 22px rgba(90,30,140,.35)}
#stage::before{content:"";position:absolute;inset:0;z-index:0;background:radial-gradient(circle at 22% 14%,#fff 0 2px,transparent 3px),radial-gradient(circle at 76% 20%,#fff 0 3px,transparent 4px),radial-gradient(circle at 58% 8%,#fff 0 2px,transparent 3px),radial-gradient(circle at 34% 38%,#fffa 0 2px,transparent 3px),radial-gradient(circle at 88% 52%,#fffa 0 2px,transparent 3px),radial-gradient(circle at 14% 62%,#fffa 0 3px,transparent 4px),linear-gradient(112deg,transparent 30%,rgba(255,255,255,.16) 40%,transparent 50%),linear-gradient(248deg,transparent 30%,rgba(255,255,255,.14) 40%,transparent 50%);pointer-events:none}
#stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16%;z-index:0;background:linear-gradient(to top,rgba(255,255,255,.5),rgba(255,255,255,.12) 70%,transparent),radial-gradient(ellipse at 50% 0,rgba(255,255,255,.5),transparent 65%);border-top:1px solid rgba(255,255,255,.35);pointer-events:none}
#doll>svg{z-index:1;position:absolute;top:0;left:64px;width:calc(100% - 128px);height:100%}
.side{z-index:2;position:absolute;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-around;padding:10px 0}
.side.l{left:8px}.side.r{right:8px}
.cat{width:48px;height:48px;border-radius:15px;border:2px solid #fff;background:linear-gradient(145deg,#FF7BBE,#E0309A);padding:9px;box-shadow:0 3px 8px rgba(120,20,90,.35)}
.cat svg{width:100%;height:100%}
.cat[aria-pressed="true"]{background:linear-gradient(145deg,#8E5BFF,#5B2FD0);box-shadow:0 0 0 3px #fff8,0 3px 8px rgba(40,10,100,.5)}
#panel{background:var(--panel);border-radius:22px;padding:10px 12px 12px;border:2px solid var(--line)}
.ph{margin:0 0 2px;font-size:1.05rem;font-weight:600}
.row{margin-top:8px}
.row h3{margin:0 0 5px;font-size:.85rem;font-weight:500;opacity:.8}
.strip{display:flex;gap:8px;overflow-x:auto;padding:3px 3px 6px}
.strip:has(.chip){flex-wrap:wrap;overflow:visible}
.th{flex:0 0 auto;width:64px;height:76px;border-radius:14px;border:2px solid transparent;background:var(--th);padding:2px;font-size:1.3rem}
.th svg{width:100%;height:100%;display:block}
.sw{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:3px solid var(--line);padding:0;font-size:1.1rem;line-height:1;background:var(--panel)}
.chip{flex:0 0 auto;border:2px solid var(--line);background:transparent;border-radius:14px;padding:9px 14px;font-weight:500;min-height:44px}
[aria-pressed="true"].th,[aria-pressed="true"].sw{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,79,160,.35)}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function doll(){
var sk=P.skin[S.skin],hc=P.hair[S.hairC],sd=P.shadow[S.shadow],bl=P.blush[S.blush],o=FLOOR+HT+L('hair',S.hair,hc)+HE+bodyL(sk)+shoesL(S.shoe,cc('shoe'));
if(S.dress>=0)o+=L('dress',S.dress,cc('dress'));
else o+=bottomL(S.bottom,cc('bottom'))+L('top',S.top,cc('top'));
if(S.cinto>0)o+=ACC.cinto(S.cinto,P.cl[S.cintoC],S.metal);
if(S.jacket>=0)o+=L('jacket',S.jacket,cc('jacket'));
if(S.pulsera>0)o+=ACC.pulsera(S.pulsera,S.metal);
if(S.bag>=0)o+=L('bag',S.bag,cc('bag'));
if(S.collar>0)o+=ACC.collar(S.collar,S.metal);
o+=FACE.cabeza(sk)+(sd?FACE.sombra(sd):'')+FACE.ojos()+FACE.cejas(hc)+(bl?FACE.rubor(bl):'')+FACE.labios(P.lips[S.lips])+FACE.frente(hc);
if(S.aros>0)o+=ACC.aros(S.aros,S.metal);
if(S.lentes>0)o+=ACC.lentes(S.lentes);
if(S.cabeza>0)o+=ACC.cabeza(S.cabeza,P.cl[S.cabezaC],S.metal);
return '<svg viewBox="0 -24 300 484" role="img" aria-label="Tu muñeca">'+DEFS(sk,P.eyes[S.eyes])+o+'</svg>';
}
function thumb(f,i){
var c=f==='hair'?P.hair[S.hairC]:cc(f),b;
if(f==='shoe')b=shoesL(i,c);
else if(f==='hair')b=F.hair[i](c)+head(P.skin[S.skin])+fr(c);
else b=F[f][i](c);
return '<svg viewBox="'+VB[f]+'">'+b+'</svg>';
}
function draw(){
var s=document.getElementById('stage');s.style.background=P.bg[S.bg];document.getElementById('doll').innerHTML=doll();
try{localStorage.setItem('vestidor6',JSON.stringify(S))}catch(e){}
}
function side(){
function btn(c,i){return '<button class="cat" data-c="'+i+'" aria-label="'+c.n+'" aria-pressed="'+(i===cur)+'"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="'+ICON[c.id]+'"/></svg></button>'}
document.getElementById('sl').innerHTML=CATS.slice(0,5).map(function(c,i){return btn(c,i)}).join('');
document.getElementById('sr').innerHTML=CATS.slice(5).map(function(c,i){return btn(c,i+5)}).join('');
}
function panel(){
var c=CATS[cur],h='<h2 class="ph">'+c.n+'</h2>';
c.rows.forEach(function(r){
h+='<div class="row"><h3>'+r.l+'</h3><div class="strip">';
if(r.t==='i'){
if(r.none)h+='<button class="th" data-k="'+r.f+'" data-i="-1" aria-label="Ninguno" aria-pressed="'+(S[r.f]===-1)+'">×</button>';
for(var i=0;i<N[r.f];i++)h+='<button class="th" data-k="'+r.f+'" data-i="'+i+'" aria-label="'+r.l+' '+(i+1)+'" aria-pressed="'+(S[r.f]===i)+'">'+thumb(r.f,i)+'</button>';
}else if(r.t==='p'){
h+=P[r.p].map(function(v,i){return '<button class="sw" data-k="'+r.k+'" data-i="'+i+'" aria-label="'+r.l+' '+(v===null?'ninguno':i+1)+'" aria-pressed="'+(S[r.k]===i)+'" '+(v?'style="background:'+v+'"':'')+'>'+(v===null?'×':'')+'</button>'}).join('');
}else h+=r.a.map(function(a,i){return '<button class="chip" data-k="'+r.k+'" data-i="'+i+'" aria-pressed="'+(S[r.k]===i)+'">'+a+'</button>'}).join('');
h+='</div></div>';
});
document.getElementById('panel').innerHTML=h;
}
document.addEventListener('click',function(e){
var b=e.target.closest('button');if(!b)return;
if(b.dataset.c!==undefined){cur=+b.dataset.c;side();panel();return}
if(b.dataset.t!==undefined)return;
var k=b.dataset.k;if(!k)return;
if(b.dataset.tog)S[k]=!S[k];else{S[k]=+b.dataset.i;if((k==='top'||k==='bottom'))S.dress=-1}
draw();panel();
});
function R(n){return Math.floor(Math.random()*n)}
document.getElementById('rnd').onclick=function(){
S.dress=Math.random()<.5?-1:R(4);S.top=R(4);S.bottom=R(4);S.jacket=Math.random()<.5?-1:R(4);S.shoe=R(5);S.bag=Math.random()<.5?-1:R(3);S.hair=R(5);
['dressC','topC','bottomC','jacketC','shoeC','bagC'].forEach(function(k){S[k]=R(10)});
['hairC','shadow','lips','blush','eyes','bg'].forEach(function(k){S[k]=R(P[k==='hairC'?'hair':k].length)});
S.aros=R(4);S.collar=R(4);S.cabeza=R(5);S.lentes=Math.random()<.7?0:1+R(3);S.pulsera=R(4);S.cinto=R(3);S.metal=R(3);S.cabezaC=R(10);S.cintoC=R(10);
draw();panel();
};
document.getElementById('rst').onclick=function(){S=Object.assign({},DEF);draw();panel()};
side();draw();panel();
